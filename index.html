<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>انجمن علمی کامپیوتر الزهرا (س) مشهد</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--brand:#33b3dd;--ink:#d8f1fb;--mist:rgba(51,179,221,.07);--navy:#07163a;--line:rgba(51,179,221,.3);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background-color:#050b24;background-image:linear-gradient(rgba(51,179,221,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(51,179,221,.055) 1px,transparent 1px);background-size:44px 44px;background-attachment:fixed;color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.9;font-size:16px}
a{color:inherit}
.w{max-width:760px;margin:0 auto;padding:0 22px}
.hero{background:radial-gradient(1200px 520px at 50% -10%,#12356b 0,var(--navy) 62%);color:#fff;position:relative;overflow:hidden;padding:42px 0 60px;text-align:center}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,#050b24);pointer-events:none}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.3}
.hero .w{position:relative;z-index:1}
.logo{width:150px;height:150px;border-radius:32px;overflow:hidden;background:var(--navy);margin:0 auto 22px;box-shadow:0 0 0 3px rgba(51,179,221,.6),0 0 50px rgba(51,179,221,.55)}
.logo img{width:100%;height:100%;display:block}
.name{margin:0;font-size:15px;font-weight:600;direction:ltr;color:#9fdcf2;font-family:ui-monospace,Consolas,monospace}
h1{margin:6px 0 24px;font-size:clamp(34px,9vw,58px);font-weight:900;line-height:1.35;color:#fff;min-height:1.4em;text-shadow:0 0 30px rgba(51,179,221,.6)}
.term{direction:ltr;text-align:left;max-width:380px;margin:0 auto;background:rgba(3,10,30,.8);border:1px solid rgba(51,179,221,.45);border-radius:14px;padding:12px 16px;font:14px/1.9 ui-monospace,Consolas,monospace;color:#bfeaf8;min-height:132px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.term i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.cur{display:inline-block;width:8px;height:15px;background:var(--brand);vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.tick{overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);background:rgba(51,179,221,.07);color:var(--brand);font:12px ui-monospace,Consolas,monospace;direction:ltr;padding:6px 0}
.tick span{display:inline-block;animation:tk 60s linear infinite}
@keyframes tk{to{transform:translateX(-50%)}}
.b{display:inline-block;padding:13px 26px;border-radius:14px;border:1.5px solid var(--brand);font:inherit;font-weight:700;text-decoration:none;color:var(--ink);background:rgba(51,179,221,.08);cursor:pointer;transition:transform .15s,box-shadow .15s}
.b.p{background:var(--brand);color:#04223a;box-shadow:0 0 24px rgba(51,179,221,.55)}
.b:not([aria-disabled=true]):hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(51,179,221,.4)}
.b[aria-disabled=true]{opacity:.55;cursor:default}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:rgba(7,22,58,.94);color:#fff;border-bottom:1px solid rgba(51,179,221,.4);backdrop-filter:blur(6px)}
.bar span{font-weight:800;direction:ltr;font-size:14px}
.b.sm{padding:8px 18px;font-size:14px;border-radius:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
section{padding:46px 0}
section+section{border-top:1px solid var(--line)}
.alt{background:var(--mist)}
h2{margin:0 0 14px;font-size:26px;font-weight:800;text-shadow:0 0 20px rgba(51,179,221,.55)}
h2::before{content:"</>";color:var(--brand);font:800 .8em ui-monospace,Consolas,monospace;display:inline-block;direction:ltr;margin-left:10px}
.about p{margin:0;max-width:60ch}
.acts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.acts li{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:16px 18px;backdrop-filter:blur(6px);transition:transform .2s,box-shadow .2s,border-color .2s}
.acts li:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 0 28px rgba(51,179,221,.4)}
.acts li::before{content:attr(data-n);display:block;font:700 13px ui-monospace,Consolas,monospace;color:var(--brand);direction:ltr;text-align:right}
.acts b{display:block;font-size:19px}
.acts span{opacity:.85}
.empty{padding:18px;border:2px dashed var(--line);background:rgba(51,179,221,.05);border-radius:14px;opacity:.9}
.ev{padding:14px 0;border-bottom:1px solid var(--line)}
.ev b{font-size:18px}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px}
.m{text-align:center}
.av{width:104px;height:104px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,#33b3dd,#1b6fa8);color:#031a2e;display:grid;place-items:center;font-size:38px;font-weight:900;overflow:hidden;box-shadow:0 0 0 3px #050b24,0 0 0 5px var(--brand),0 0 28px rgba(51,179,221,.5)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.m b{display:block;font-size:17px;line-height:1.5}
.m .r{font-size:14px;font-weight:600}
.m .i{font-size:13px;opacity:.7}
.lst{list-style:none;margin:0;padding:0}
.it{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.cv{flex:none;width:72px;height:72px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;overflow:hidden;border:1px solid var(--brand);box-shadow:0 0 16px rgba(51,179,221,.35)}
.cv.tall{width:64px;height:88px}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.it .tx{flex:1;min-width:0}
.it b{display:block;font-size:17px;line-height:1.6}
.it .d{font-size:13px;opacity:.7}
.it a.go{flex:none;font-weight:700;font-size:14px;color:var(--ink);border:1.5px solid var(--brand);border-radius:10px;padding:6px 14px;text-decoration:none}
.ct{list-style:none;margin:0;padding:0}
.ct li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.ct li>span:first-child{min-width:96px;font-weight:700}
.ct a{direction:ltr;font-weight:600;color:#8fe0ff;text-decoration:underline;text-decoration-color:var(--brand);text-decoration-thickness:2px;text-underline-offset:4px}
.mute{opacity:.6;font-size:14px}
.vb{margin-bottom:24px}
.vb b{display:block;margin-bottom:8px;font-size:17px}
.fr{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:0 0 24px rgba(51,179,221,.2)}
.fr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.dlg{background:var(--navy);border:1.5px solid var(--brand);border-radius:18px;padding:22px;max-width:min(420px,92vw);color:var(--ink);font-family:inherit;line-height:1.9;box-shadow:0 0 40px rgba(51,179,221,.4)}
.dlg::backdrop{background:rgba(3,8,24,.7)}
.dlg b{display:block;font-size:20px;margin-bottom:6px}
.dlg a{direction:ltr;font-weight:700;color:#8fe0ff;text-decoration:underline;text-decoration-color:var(--brand);text-underline-offset:4px}
.dlg .b{margin-top:8px}
footer{padding:26px 0 40px;text-align:center;font-size:13px;opacity:.7;border-top:1px solid var(--line)}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.tick span,.cur{animation:none}.rv{opacity:1;transform:none;transition:none}}
</style>
</head>

<script>

var CONFIG = {

<div id="app"></div>
<script>
(function(){
var S=CONFIG,app=document.getElementById('app');
function h(t,a){var e=document.createElement(t);a=a||{};for(var k in a){if(k==='class')e.className=a[k];else e.setAttribute(k,a[k]);}
 for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
function ok(u){return /^https?:\/\//i.test(u||'');}
function sec(id,cls,title){var s=h('section',{id:id,class:cls||''}),w=h('div',{class:'w'});if(title)w.append(h('h2',{},title));s.append(w);return [s,w];}
document.title=S.title;

var BIN=Array(24).join('01100001 01101100 01100111 01101111 ');
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function decode(el,txt){if(RM){el.textContent=txt;return;}var ch=Array.from(txt),n=ch.length,i=0,t=setInterval(function(){var o='';for(var k=0;k<n;k++)o+=(ch[k]===' '||k<i)?ch[k]:(Math.random()<.5?'0':'1');el.textContent=o;i+=.45;if(i>n){clearInterval(t);el.textContent=txt;}},55);}
function typeLines(out,lines){if(RM){out.textContent=lines.join('\n');return;}var s='',li=0,ci=0;(function step(){if(li>=lines.length)return;var L=lines[li];if(ci<L.length){s+=L[ci++];out.textContent=s;setTimeout(step,34);}else{s+='\n';out.textContent=s;li++;ci=0;setTimeout(step,380);}})();}
function rain(cv){if(RM)return;var c=cv.getContext('2d'),W,H,cols,dr;function sz(){W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight;cols=Math.floor(W/16);dr=[];for(var i=0;i<cols;i++)dr.push(Math.random()*H/16);}sz();setInterval(function(){c.fillStyle='rgba(7,22,58,.14)';c.fillRect(0,0,W,H);c.fillStyle='#33b3dd';c.font='14px monospace';for(var i=0;i<cols;i++){c.fillText(Math.random()<.5?'0':'1',i*16,dr[i]*16);if(dr[i]*16>H&&Math.random()>.975)dr[i]=0;dr[i]++;}},75);}

var hero=h('header',{class:'hero'}),hw=h('div',{class:'w'}),lg=h('div',{class:'logo'}),im=h('img',{alt:'لوگوی انجمن'});im.src=S.logo;lg.append(im);
var slog='از '+S.slogan[0]+' تا '+S.slogan[1],h1=h('h1',{},slog),termOut=h('span',{}),term=h('div',{class:'term','aria-hidden':'true'},h('div',{},h('i',{style:'background:#ff5f56'}),h('i',{style:'background:#ffbd2e'}),h('i',{style:'background:#27c93f'})),h('div',{style:'white-space:pre'},termOut,h('span',{class:'cur'})));var cv=h('canvas',{'aria-hidden':'true'});
var join=h('button',{class:'b p',type:'button'},'عضویت در انجمن');
var dlg=h('dialog',{class:'dlg'}),closeBtn=h('button',{class:'b',type:'button'},'بستن');
function jrow(t,x){return h('p',{},t+' ',h('a',{href:x.url,target:'_blank',rel:'noopener noreferrer'},x.text));}
dlg.append(h('b',{},S.join.title),h('p',{},S.join.text),jrow('آیدی ربات:',S.join.bot),jrow(S.join.contactLabel,S.join.contact),closeBtn);
join.addEventListener('click',function(){dlg.showModal();});
closeBtn.addEventListener('click',function(){dlg.close();});
document.body.append(dlg);
hw.append(lg,h('p',{class:'name'},S.name),h1,term);hero.prepend(cv);
hero.append(hw);join.className+=' sm';
app.append(h('div',{class:'bar'},h('span',{},S.name),join),hero,h('div',{class:'tick','aria-hidden':'true'},h('span',{},BIN+BIN)));
rain(cv);decode(h1,slog);setTimeout(function(){typeLines(termOut,['> idea = think()','> code = write(idea)','> return algorithm  // done']);},1400);

var a=sec('about','about','درباره‌ی انجمن');a[1].append(h('p',{},S.about));app.append(a[0]);

var b=sec('acts','alt','فعالیت‌ها');var ul=h('ul',{class:'acts'});
S.activities.forEach(function(x,i){ul.append(h('li',{'data-n':'0'+(i+1)},h('b',{},x.t),h('span',{},x.d)));});
b[1].append(ul);app.append(b[0]);

var c=sec('video','vid','ویدئوی معرفی'),n=0;
S.videos.forEach(function(x){
 if(!ok(x.url))return;n++;
 var u=x.url,src='',m;
 if(m=u.match(/aparat\.com\/v\/([A-Za-z0-9]+)/))src='https://www.aparat.com/video/video/embed/videohash/'+m[1]+'/vt/frame';
 else if(m=u.match(/(?:youtu\.be\/|v=)([\w-]{11})/))src='https://www.youtube.com/embed/'+m[1];
 var box=h('div',{class:'vb'},h('b',{},x.title));
 if(src){box.append(h('div',{class:'fr'},h('iframe',{src:src,allowfullscreen:'',loading:'lazy',title:x.title})));}
 else box.append(h('a',{class:'b p',href:u,target:'_blank',rel:'noopener noreferrer'},'تماشا'));
 c[1].append(box);
});
if(!n)c[1].append(h('div',{class:'empty'},'ویدئوهای معرفی انجمن به‌زودی اینجا قرار می‌گیرند.'));
app.append(c[0]);

var d=sec('programs','alt','برنامه‌های پیش‌رو');
if(S.programs.length)S.programs.forEach(function(e){d[1].append(h('div',{class:'ev'},h('b',{},e.title),h('div',{},e.date),h('div',{},e.desc||'')));});
else d[1].append(h('div',{class:'empty'},'برنامه‌ی بعدی هنوز اعلام نشده است. اطلاعیه‌ها را در کانال های انجمن دنبال کنید.'));
app.append(d[0]);

function items(id,cls,title,arr,tall,emptyMsg,label){
 var s=sec(id,cls,title),ul=h('ul',{class:'lst'});
 arr.forEach(function(x,i){
  var cv=h('div',{class:'cv'+(tall?' tall':'')});
  if(x.cover){var im=h('img',{alt:''});im.src=x.cover;cv.append(im);}else cv.append(String(arr.length-i));
  var tx=h('div',{class:'tx'},h('b',{},x.title),h('div',{class:'d'},x.date||''));
  if(x.desc)tx.append(h('div',{},x.desc));
  var li=h('li',{class:'it'},cv,tx);
  if(ok(x.url))li.append(h('a',{class:'go',href:x.url,target:'_blank',rel:'noopener noreferrer'},label));
  ul.append(li);
 });
 if(arr.length)s[1].append(ul);else s[1].append(h('div',{class:'empty'},emptyMsg));
 app.append(s[0]);
}
items('podcast','','پادکست',S.podcast,false,'اولین اپیزود به‌زودی منتشر می‌شود.','شنیدن');
items('newsletter','alt','نشریه',S.newsletter,true,'اولین شماره به‌زودی منتشر می‌شود.','مطالعه');

var mb=sec('members','','اعضای انجمن'),mg=h('div',{class:'mem'});
S.members.forEach(function(x){
 var av=h('div',{class:'av'});
 if(x.photo){var im=h('img',{alt:x.name});im.src=x.photo;av.append(im);}else av.append((x.name||'؟').charAt(0));
 var m=h('div',{class:'m'},av,h('b',{},x.name),h('div',{class:'r'},x.role||''));
 if(x.info)m.append(h('div',{class:'i'},x.info));
 mg.append(m);
});
if(S.members.length)mb[1].append(mg);else mb[1].append(h('div',{class:'empty'},'معرفی اعضا به‌زودی اضافه می‌شود.'));
app.append(mb[0]);

var e=sec('contact','alt','ارتباط با ما'),cl=h('ul',{class:'ct'});
S.links.forEach(function(l){
 var li=h('li',{},h('span',{},l.label));
 if(ok(l.url))li.append(h('a',{href:l.url,target:'_blank',rel:'noopener noreferrer'},l.text||l.url));
 else li.append(h('span',{class:'mute'},'لینک به‌زودی اضافه می‌شود'));
