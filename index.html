<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>انجمن علمی کامپیوتر الزهرا (س) مشهد</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--brand:#33b3dd;--ink:#0b5873;--mist:#eaf7fc;--navy:#07163a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.9;font-size:16px}
a{color:inherit}
.w{max-width:760px;margin:0 auto;padding:0 22px}
.hero{background:linear-gradient(#fff 0,var(--mist) 100%);padding:44px 0 56px;text-align:center}
.logo{width:150px;height:150px;border-radius:32px;overflow:hidden;background:var(--navy);margin:0 auto 22px;box-shadow:0 10px 28px rgba(7,22,58,.3)}
.logo img{width:100%;height:100%;display:block}
.name{margin:0;font-size:15px;font-weight:600;direction:ltr;opacity:.75}
h1{margin:6px 0 26px;font-size:clamp(34px,9vw,58px);font-weight:900;line-height:1.35}
.path{display:flex;align-items:center;gap:0;max-width:420px;margin:0 auto 34px;font-weight:800;font-size:14px}
.path .n{flex:none;padding:5px 14px;border-radius:999px;border:2px solid var(--brand);background:#fff}
.path .n.end{background:var(--brand);color:#06384b;border-color:var(--brand);animation:fill .4s 1.5s both}
.path .l{flex:1;height:3px;background:var(--brand);transform-origin:right;animation:draw 1.4s .2s cubic-bezier(.6,0,.2,1) both;border-radius:2px}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fill{from{background:#fff;color:var(--ink)}to{background:var(--brand);color:#06384b}}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.b{display:inline-block;padding:13px 26px;border-radius:14px;border:2px solid var(--brand);font:inherit;font-weight:700;text-decoration:none;color:var(--ink);background:#fff;cursor:pointer}
.b.p{background:var(--brand);color:#06384b}
.b[aria-disabled=true]{opacity:.55;cursor:default}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:rgba(255,255,255,.96);border-bottom:2px solid var(--mist);backdrop-filter:blur(6px)}
.bar span{font-weight:800;direction:ltr;font-size:14px}
.b.sm{padding:8px 18px;font-size:14px;border-radius:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:30}
section{padding:46px 0}
h2{margin:0 0 14px;font-size:26px;font-weight:800}
.about p{margin:0;max-width:60ch}
.acts{list-style:none;margin:0;padding:0;border-right:4px solid var(--brand)}
.acts li{padding:12px 20px}
.acts b{display:block;font-size:19px}
.acts span{opacity:.8}
.alt{background:var(--mist)}
.vid video{width:100%;border-radius:16px;background:#000;margin-top:10px}
.empty{padding:18px;border:2px dashed var(--brand);border-radius:14px;opacity:.85}
.ev{padding:14px 0;border-bottom:1px solid #cfe9f3}
.ev b{font-size:18px}
.links{display:flex;gap:12px;flex-wrap:wrap}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px}
.m{text-align:center}
.av{width:104px;height:104px;border-radius:50%;margin:0 auto 10px;background:var(--brand);color:#06384b;display:grid;place-items:center;font-size:38px;font-weight:900;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.m b{display:block;font-size:17px;line-height:1.5}
.m .r{font-size:14px;font-weight:600}
.m .i{font-size:13px;opacity:.75}
.lst{list-style:none;margin:0;padding:0}
.it{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #cfe9f3}
.cv{flex:none;width:72px;height:72px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;overflow:hidden}
.cv.tall{width:64px;height:88px}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.it .tx{flex:1;min-width:0}
.it b{display:block;font-size:17px;line-height:1.6}
.it .d{font-size:13px;opacity:.7}
.it a.go{flex:none;font-weight:700;font-size:14px;color:var(--ink);border:2px solid var(--brand);border-radius:10px;padding:6px 14px;text-decoration:none}
.ct{list-style:none;margin:0;padding:0}
.ct li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:12px 0;border-bottom:1px solid #cfe9f3}
.ct li>span:first-child{min-width:96px;font-weight:700}
.ct a{direction:ltr;font-weight:600;text-decoration:underline;text-decoration-color:var(--brand);text-decoration-thickness:2px;text-underline-offset:4px}
.mute{opacity:.6;font-size:14px}
.vb{margin-bottom:24px}
.vb b{display:block;margin-bottom:8px;font-size:17px}
.fr{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;background:#000}
.fr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
footer{padding:26px 0 40px;text-align:center;font-size:13px;opacity:.7}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.path .l,.path .n.end{animation:none}}
</style>
</head>
<body>
<script>
/* ===================== تنظیمات صفحه (فقط این بخش را ویرایش کنید) ===================== */
var CONFIG = {
  name: "AlzahraComputerAssoc",
  title: "انجمن علمی کامپیوتر الزهرا (س) مشهد",
  logo: "logo.jpg",
  slogan: ["ایده", "الگوریتم"],          /* «از ایده تا الگوریتم» */

  about: "ما جایی هستیم برای دانشجوهایی که میخواهند یاد بگیرند، بسازند و ایده‌هایشان را به کد تبدیل کنند. اینجا با کارگاه، رویداد، نشریه، پادکست و مسابقه کنار هم رشد میکنیم.",

  activities: [
    { t: "کارگاه‌ها و رویدادهای علمی", d: "آموزش عملی مهارت‌های کامپیوتر، از مقدماتی تا پروژه‌محور." },
    { t: "نشریه", d: "مقاله، گزارش و تجربه‌های اعضای انجمن." },
    { t: "پادکست", d: "گفت‌وگو درباره‌ی فناوری، مسیر شغلی و تجربه‌ی تحصیل." },
    { t: "مسابقات", d: "برنامه‌نویسی و چالش‌های علمی برای محک زدن مهارت‌ها." }
  ],

  /* ویدئوی معرفی: لینک آپارات/یوتیوب، یا اسم فایل مثل "video.mp4". اگر آماده نیست خالی بگذارید. */
  videos: [
  { title: "ویدئوی اول", url: "" },
  { title: "ویدئوی دوم", url: "" },
  { title: "ویدئوی سوم", url: "" }
],

  /* برنامه‌های پیش‌رو. هر مورد یک خط: عنوان، تاریخ، توضیح. اگر خالی باشد پیام «به‌زودی» نشان داده می‌شود. */
  programs: [],

  /* اعضا. عکس را داخل پوشه‌ی images بگذارید و اسمش را بنویسید (مثلاً "images/ali.jpg"). بدون عکس، حرف اول اسم نشان داده می‌شود. */
  members: [
    { name: "نام عضو", role: "دبیر انجمن", info: "رشته یا توضیح کوتاه", photo: "" },
    { name: "نام عضو", role: "عضو هیئت مدیره", info: "رشته یا توضیح کوتاه", photo: "" },
    { name: "نام عضو", role: "مسئول نشریه", info: "رشته یا توضیح کوتاه", photo: "" }
  ],

  /* پادکست: برای هر اپیزود جدید، یک خط مثل خط‌های زیر کپی کنید و «بالای» لیست بگذارید (جدیدترین اول).
     url = لینک شنیدن، cover = عکس کاور (اختیاری). */
  podcast: [
    { title: "نمونه: اپیزود اول", date: "تاریخ انتشار", desc: "توضیح کوتاه اپیزود", url: "", cover: "" }
  ],

  /* نشریه: برای هر شماره‌ی جدید، یک خط اضافه کنید (جدیدترین اول). url = لینک دانلود یا مطالعه، cover = عکس جلد. */
  newsletter: [
    { title: "نمونه: شماره‌ی اول", date: "تاریخ انتشار", url: "", cover: "" }
  ],

  /* راه‌های ارتباطی. text = متنی که دیده می‌شود، url = لینک آن. اگر url خالی باشد، «به‌زودی» نشان داده می‌شود. */
  links: [
    { label: "تلگرام", text: "@Alzahra_Computer_Assoc", url: "https://t.me/Alzahra_Computer_Assoc" },
    { label: "اینستاگرام", text: "@alzahra_computer_assoc", url: "https://www.instagram.com/alzahra_computer_assoc" },
    { label: "ایتا", text: "@alzahra_computer_assoc", url: "https://eitaa.com/alzahra_computer_assoc" },
    { label: "بله", text: "@alzahra_computer_assoc", url: "https://ble.ir/alzahra_computer_assoc" }
  ]
};
/* ==================================================================================== */
</script>
<div id="app"></div>
<script>
(function(){
var S=CONFIG,app=document.getElementById('app');
function h(t,a){var e=document.createElement(t);a=a||{};for(var k in a){if(k==='class')e.className=a[k];else e.setAttribute(k,a[k]);}
 for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
function ok(u){return /^https?:\/\//i.test(u||'');}
function sec(id,cls,title){var s=h('section',{id:id,class:cls||''}),w=h('div',{class:'w'});if(title)w.append(h('h2',{},title));s.append(w);return [s,w];}
document.title=S.title;

var hero=h('header',{class:'hero'}),hw=h('div',{class:'w'}),lg=h('div',{class:'logo'}),im=h('img',{alt:'لوگوی انجمن'});im.src=S.logo;lg.append(im);
var path=h('div',{class:'path','aria-hidden':'true'},h('span',{class:'n'},S.slogan[0]),h('span',{class:'l'}),h('span',{class:'n end'},S.slogan[1]));
var cta=h('div',{class:'cta'});
var join=ok(S.joinUrl)?h('a',{class:'b p',href:S.joinUrl,target:'_blank',rel:'noopener noreferrer'},'عضویت در انجمن'):h('span',{class:'b p','aria-disabled':'true'},'عضویت (به‌زودی)');

hw.append(lg,h('p',{class:'name'},S.name),h('h1',{},'از '+S.slogan[0]+' تا '+S.slogan[1]),path);
hero.append(hw);var bj=join.cloneNode(true);bj.className+=' sm';app.append(h('div',{class:'bar'},h('span',{},S.name),bj),hero);

var a=sec('about','about','درباره‌ی انجمن');a[1].append(h('p',{},S.about));app.append(a[0]);

var b=sec('acts','alt','فعالیت‌ها');var ul=h('ul',{class:'acts'});
S.activities.forEach(function(x){ul.append(h('li',{},h('b',{},x.t),h('span',{},x.d)));});
b[1].append(ul);app.append(b[0]);

var c=sec('video','vid','ویدئوی معرفی'),n=0;
S.videos.forEach(function(x){
 if(!ok(x.url))return;n++;
 var u=x.url,src='',m;
 if(m=u.match(/aparat\.com\/v\/([A-Za-z0-9]+)/))src='https://www.aparat.com/video/video/embed/videohash/'+m[1]+'/vt/frame';
 else if(m=u.match(/(?:youtu\.be\/|v=)([\w-]{11})/))src='https://www.youtube.com/embed/'+m[1];
 var box=h('div',{class:'vb'},h('b',{},x.title));
 if(src){box.append(h('div',{class:'fr'},h('iframe',{src:src,allowfullscreen:'',loading:'lazy',title:x.title})));}
 else box.append(h('a',{class:'b p',href:u,target:'_blank',rel:'noopener noreferrer'},'تماشا'));
 c[1].append(box);
});
if(!n)c[1].append(h('div',{class:'empty'},'ویدئوهای معرفی انجمن به‌زودی اینجا قرار می‌گیرند.'));
app.append(c[0]);

var d=sec('programs','alt','برنامه‌های پیش‌رو');
if(S.programs.length)S.programs.forEach(function(e){d[1].append(h('div',{class:'ev'},h('b',{},e.title),h('div',{},e.date),h('div',{},e.desc||'')));});
else d[1].append(h('div',{class:'empty'},'برنامه‌ی بعدی هنوز اعلام نشده است. اطلاعیه‌ها را در کانال تلگرام دنبال کنید.'));
app.append(d[0]);

function items(id,cls,title,arr,tall,emptyMsg,label){
 var s=sec(id,cls,title),ul=h('ul',{class:'lst'});
 arr.forEach(function(x,i){
  var cv=h('div',{class:'cv'+(tall?' tall':'')});
  if(x.cover){var im=h('img',{alt:''});im.src=x.cover;cv.append(im);}else cv.append(String(arr.length-i));
  var tx=h('div',{class:'tx'},h('b',{},x.title),h('div',{class:'d'},x.date||''));
  if(x.desc)tx.append(h('div',{},x.desc));
  var li=h('li',{class:'it'},cv,tx);
  if(ok(x.url))li.append(h('a',{class:'go',href:x.url,target:'_blank',rel:'noopener noreferrer'},label));
  ul.append(li);
 });
 if(arr.length)s[1].append(ul);else s[1].append(h('div',{class:'empty'},emptyMsg));
 app.append(s[0]);
}
items('podcast','','پادکست',S.podcast,false,'اولین اپیزود به‌زودی منتشر می‌شود.','شنیدن');
items('newsletter','alt','نشریه',S.newsletter,true,'اولین شماره به‌زودی منتشر می‌شود.','مطالعه');

var mb=sec('members','','اعضای انجمن'),mg=h('div',{class:'mem'});
S.members.forEach(function(x){
 var av=h('div',{class:'av'});
 if(x.photo){var im=h('img',{alt:x.name});im.src=x.photo;av.append(im);}else av.append((x.name||'؟').charAt(0));
 var m=h('div',{class:'m'},av,h('b',{},x.name),h('div',{class:'r'},x.role||''));
 if(x.info)m.append(h('div',{class:'i'},x.info));
 mg.append(m);
});
if(S.members.length)mb[1].append(mg);else mb[1].append(h('div',{class:'empty'},'معرفی اعضا به‌زودی اضافه می‌شود.'));
app.append(mb[0]);

var e=sec('contact','alt','ارتباط با ما'),cl=h('ul',{class:'ct'});
S.links.forEach(function(l){
 var li=h('li',{},h('span',{},l.label));
 if(ok(l.url))li.append(h('a',{href:l.url,target:'_blank',rel:'noopener noreferrer'},l.text||l.url));
 else li.append(h('span',{class:'mute'},'لینک به‌زودی اضافه می‌شود'));
 cl.append(li);
});
e[1].append(cl);app.append(e[0]);
app.append(h('footer',{},h('div',{class:'w'},S.title)));
})();
</script>
</body>
</html>
