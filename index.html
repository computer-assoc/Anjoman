<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlzahraComputerAssoc</title>
<link rel="icon" href="logo.jpg">
<style>
:root{--brand:#33b3dd;--ink:#0b5873;--soft:#e8f6fb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:36px 20px 48px}
.logo{width:92px;height:92px;border-radius:50%;background:var(--brand);margin:0 auto 18px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(51,179,221,.35)}
.logo.pic{width:170px;height:170px;border-radius:34px;overflow:hidden;background:#050b24;box-shadow:0 10px 28px rgba(5,11,36,.35)}
.logo.pic img{width:100%;height:100%;display:block}
.logo svg{width:46px;height:46px}
h1{margin:0;text-align:center;font-size:25px;font-weight:800;direction:ltr;letter-spacing:.2px}
.sub{text-align:center;margin:6px 0 28px;font-size:15px;opacity:.8}
.btn{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;margin-bottom:14px;border:2px solid var(--brand);border-radius:16px;background:#fff;color:var(--ink);font:inherit;font-weight:600;font-size:16px;text-decoration:none;cursor:pointer;text-align:right}
.btn .ic{flex:none;width:38px;height:38px;border-radius:50%;background:var(--brand);display:grid;place-items:center}
.btn .ic svg{width:20px;height:20px;fill:#fff}
.btn.main{background:var(--brand);color:#06384b;font-size:17px}
.btn.main .ic{background:#fff}.btn.main .ic svg{fill:var(--brand)}
.btn .t{flex:1}
.panel{background:var(--soft);border-radius:16px;padding:16px;margin:-4px 0 16px;line-height:1.9;font-size:15px}
.panel video{width:100%;border-radius:12px;background:#000;margin-top:8px}
.soon{opacity:.75;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ تنظیمات صفحه: فقط این بخش را ویرایش کنید ============ */
var CONFIG = {
  title: "AlzahraComputerAssoc",
  subtitle: "انجمن علمی کامپیوتر الزهرا (س) مشهد",
  logo: "logo.jpg",

  introLabel: "معرفی انجمن",
  introText: "",
  // لینک ویدئو (آپارات/یوتیوب) یا اسم فایل ویدئو مثل "video.mp4". اگر آماده نیست خالی بگذارید:
  introVideo: "",

  // هر خط یک دکمه است. برای حذف، خط را پاک کنید؛ برای افزودن، یک خط مشابه اضافه کنید.
  links: [
    { label: "تلگرام انجمن",     url: "https://t.me/Alzahra_Computer_Assoc" },
    { label: "اینستاگرام انجمن", url: "https://www.instagram.com/alzahra_computer_assoc" }
  ]
};
/* ================================================================== */
</script>
<script>
(function(){
var S=CONFIG,app=document.getElementById('app');
var ICON={
 tg:'<svg viewBox="0 0 24 24"><path d="M22 3L2 11l6.500 2.500L10 21l3.500-4.500L19 20z"/></svg>',
 ig:'<svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 015 5v10a5 5 0 01-5 5H7a5 5 0 01-5-5V7a5 5 0 015-5zm0 2a3 3 0 00-3 3v10a3 3 0 003 3h10a3 3 0 003-3V7a3 3 0 00-3-3H7zm5 3.500a4.500 4.500 0 110 9 4.500 4.500 0 010-9zm0 2a2.500 2.500 0 100 5 2.500 2.500 0 000-5zM17.500 5.800a1.200 1.200 0 110 2.400 1.200 1.200 0 010-2.400z"/></svg>',
 play:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-2 5.500l7 4.500-7 4.500v-9z"/></svg>',
 link:'<svg viewBox="0 0 24 24"><path d="M10.600 13.400a4 4 0 005.700 0l3-3a4 4 0 00-5.700-5.700l-1.100 1.100 1.400 1.400 1.100-1.100a2 2 0 112.800 2.800l-3 3a2 2 0 01-2.800 0l-1.400 1.500zm2.800-2.800a4 4 0 00-5.700 0l-3 3a4 4 0 005.700 5.700l1.100-1.100-1.400-1.400-1.100 1.100a2 2 0 11-2.800-2.800l3-3a2 2 0 012.800 0l1.400-1.500z"/></svg>'
};
function iconFor(u){u=(u||'').toLowerCase();return u.indexOf('t.me')>-1||u.indexOf('telegram')>-1?'tg':u.indexOf('instagram')>-1?'ig':'link';}
function h(tag,attrs){var e=document.createElement(tag);attrs=attrs||{};for(var k in attrs){if(k==='class')e.className=attrs[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}
 for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
function ic(n){var s=h('span',{class:'ic'});s.innerHTML=ICON[n];return s;}
function isHttp(u){return /^https?:\/\//i.test(u||'');}
function isFile(u){return /\.(mp4|webm|mov)(\?|$)/i.test(u||'');}
document.title=S.title;
var wrap=h('div',{class:'wrap'});
var logo=h('div',{class:'logo pic'});var im=h('img',{alt:'لوگوی انجمن'});im.src=S.logo;logo.append(im);
wrap.append(logo,h('h1',{},S.title),h('div',{class:'sub'},S.subtitle));
var panel=h('div',{class:'panel',hidden:''});
if(S.introText)panel.append(h('div',{},S.introText));
var v=S.introVideo;
if(v){
 if(isFile(v)){var vid=h('video',{controls:'',playsinline:'',preload:'metadata'});vid.src=v;panel.append(vid);}
 else if(isHttp(v)){var a=h('a',{class:'btn',href:v,target:'_blank',rel:'noopener noreferrer'},ic('play'),h('span',{class:'t'},'تماشای ویدئو'));a.style.margin='10px 0 0';panel.append(a);}
}else if(!S.introText){panel.append(h('div',{class:'soon'},'ویدئوی معرفی انجمن به‌زودی اینجا قرار می‌گیرد.'));}
wrap.append(h('button',{class:'btn main',type:'button',onclick:function(){panel.hidden=!panel.hidden;}},ic('play'),h('span',{class:'t'},S.introLabel)),panel);
S.links.forEach(function(l){if(!isHttp(l.url))return;wrap.append(h('a',{class:'btn',href:l.url,target:'_blank',rel:'noopener noreferrer'},ic(iconFor(l.url)),h('span',{class:'t'},l.label)));});
app.append(wrap);
})();
</script>
</body>
</html>
